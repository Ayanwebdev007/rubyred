services:
  - type: web
    name: rubyred
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyAMMWrOUIldja-Lz9p10npv0rQ4XvO1zDc
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: rubyred-564af.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: rubyred-564af
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: rubyred-564af.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "1039753044968"
      - key: VITE_FIREBASE_APP_ID
        value: "1:1039753044968:web:06f6936cd270f2dc2e3a5d"
