services:
  - type: web
    name: rubyred
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyAiizyrH_pX0q_Q5_8AVCPBalYFG2OQh4w
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: rubyred-4d5e1.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: rubyred-4d5e1
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: rubyred-4d5e1.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "321534534071"
      - key: VITE_FIREBASE_APP_ID
        value: "1:321534534071:web:3bb3ef8048236c1c17c832"
